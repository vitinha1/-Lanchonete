<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lanchonete - Cálculo de Conta</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixa-sistema">
        <h2>Sistema da Lanchonete</h2>

     

       
        <label>Código do produto:</label>
        <input type="number" id="inputCodigo" placeholder="Digite de 1 a 5">

        <label>Quantidade comprada:</label>
        <input type="number" id="inputQuantidade" placeholder="Ex: 3">

      
        <button onclick="calcularMesa()">Calcular Total</button>

        
        <div id="resultadoFinal">Valor a pagar: R$ 0,00</div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
